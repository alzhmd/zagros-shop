# nginx برای زاگرس پشت ArvanCloud CDN.
# Arvan در لبه TLS را می‌دهد (HTTPS به کاربر) و به این origin روی HTTP:80 وصل می‌شود.
# (پورت 443 این سرور در اختیار xray است؛ به آن دست نمی‌زنیم.)
#
# نصب:
#   cp deploy/nginx-arvan.conf /etc/nginx/sites-available/zagros
#   ln -sf /etc/nginx/sites-available/zagros /etc/nginx/sites-enabled/zagros
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name znjzagros.ir www.znjzagros.ir;

    client_max_body_size 12m;

    # فشرده‌سازی سبک (اپ خودش br/gzip دارد؛ این برای موارد پراکسی‌نشده).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # WebSocket چت زنده.
    location ~ ^/support/chat/[^/]+/ws$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # کل ترافیک به اپ Rust (اپ خودش asset را با کش immutable سرو می‌کند).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
