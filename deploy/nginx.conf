# پیکربندی nginx برای زاگرس — reverse proxy + TLS + استاتیک + WebSocket.
# نصب:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/zagros
#   sudo ln -s /etc/nginx/sites-available/zagros /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# دامنه و گواهی TLS را با مقدار واقعی جایگزین کنید (مثلاً با certbot).

# محدودیت نرخ: حداکثر ~۱۰ درخواست بر ثانیه برای هر IP (با برست).
limit_req_zone $binary_remote_addr zone=zagros_rl:10m rate=10r/s;

# نگاشت برای ارتقای WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ریدایرکت HTTP → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name zagros.example.ir www.zagros.example.ir;   # ← دامنه‌ی واقعی

    # مسیر چالش ACME (certbot) بدون ریدایرکت.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    # نحو سازگار با nginx قدیمی‌تر (۱.۲۴ و پایین‌تر)؛ در ۱.۲۵+ هم کار می‌کند.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zagros.example.ir www.zagros.example.ir;   # ← دامنه‌ی واقعی

    # --- TLS (مسیر گواهی واقعی) ---
    ssl_certificate     /etc/letsencrypt/live/zagros.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zagros.example.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- سرآیندهای امنیتی (اپ هم سرآیندهای پایه می‌فرستد؛ اینجا HSTS را افزودیم) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # سقف حجم آپلود (تصاویر محصول در آینده).
    client_max_body_size 12m;

    # --- فشرده‌سازی (اپ خودش br/gzip دارد؛ این برای پاسخ‌های پراکسی‌نشده/استاتیک nginx) ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- asset استاتیک: مستقیم از دیسک با کش طولانی (دور زدن اپ) ---
    location /assets/ {
        alias /opt/zagros/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- WebSocket چت زنده: بدون بافر، تایم‌اوت طولانی ---
    location ~ ^/support/chat/[^/]+/ws$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # اتصال چت طولانی‌مدت باز می‌ماند
        proxy_buffering off;
    }

    # --- بقیه‌ی ترافیک به اپ Rust ---
    location / {
        limit_req zone=zagros_rl burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
