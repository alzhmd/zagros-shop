{% if let Some(name) = user_name %}
<a href="/account/notifications" class="icon-btn notif-link" aria-label="اعلان‌ها">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    {% if let Some(u) = unread_fa %}<span class="notif-badge">{{ u }}</span>{% endif %}
</a>
<a href="/account" class="btn btn-ghost account-link">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span class="account-link-name">{{ name }}</span>
</a>
{% if is_admin %}<a href="/admin" class="btn btn-ghost header-admin-link" aria-label="پنل مدیریت">مدیریت</a>{% endif %}
{% else %}
<a href="/account" class="btn btn-ghost">ورود</a>
{% endif %}
